name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Deployment reason"
        required: false
        type: string

jobs:
  build-and-deploy:
    name: Build & Deploy via JumpServer
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build Docker image
        run: |
          TAG="$(date +'%Y%m%d%H%M%S')-$(git rev-parse --short HEAD)"
          echo "TAG=${TAG}" >> $GITHUB_ENV
          docker build -t "new-api:${TAG}" .
          docker save "new-api:${TAG}" -o /tmp/new-api.tar

      - name: Upload via SCP
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.JUMP_SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -P 36000 -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key /tmp/new-api.tar root@43.128.122.99:/tmp/

      - name: Deploy via JumpServer
        run: |
          ssh -p 36000 -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key root@43.128.122.99 "
            cd /opt/new-api || exit 1
            git checkout main
            git pull origin main
            bash scripts/deploy.sh --dist-from-tar /tmp/new-api.tar
          "
