name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Deployment reason"
        required: false
        type: string

jobs:
  build-and-deploy:
    name: Build & Deploy via JumpServer
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build Docker image
        run: |
          TAG="$(date +'%Y%m%d%H%M%S')-$(git rev-parse --short HEAD)"
          echo "TAG=${TAG}" >> $GITHUB_ENV
          docker build -t "new-api:${TAG}" .
          docker save "new-api:${TAG}" -o /tmp/new-api.tar

      - name: Upload image to JumpServer
        uses: appleboy/scp-action@v0
        with:
          host: 43.128.122.99
          port: 36000
          username: root
          key: ${{ secrets.JUMP_SERVER_SSH_KEY }}
          source: /tmp/new-api.tar
          target: /tmp/

      - name: Deploy via JumpServer
        uses: appleboy/ssh-action@v1
        with:
          host: 43.128.122.99
          port: 36000
          username: root
          key: ${{ secrets.JUMP_SERVER_SSH_KEY }}
          script: |
            cd /opt/new-api || { echo "ERROR: /opt/new-api not found"; exit 1; }
            git checkout main
            git pull origin main
            bash scripts/deploy.sh --dist-from-tar /tmp/new-api.tar
